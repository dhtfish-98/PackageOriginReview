[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
name = "package-origin-review"
version = "0.1.1"
description = "Bounded offline npm lockfile declared-origin policy review"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
package-origin-review = "package_origin_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/PackageOriginReview" = ["ORIGIN.md", "DEFENSIVE_SCOPE.md", "VALIDATION.md", "SOURCE_AUDIT.json", "SOURCE_REVIEW_MANIFEST.json"]

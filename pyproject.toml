[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
name = "package-origin-review"
version = "0.1.2"
description = "Bounded offline npm lockfile declared-origin policy review"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
dependencies = []

[project.scripts]
package-origin-review = "package_origin_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/PackageOriginReview" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md", "SOURCE_AUDIT.json", "SOURCE_REVIEW_MANIFEST.json"]
